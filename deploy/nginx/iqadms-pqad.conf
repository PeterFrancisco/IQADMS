# IQADMS on pqad — one public port: static SPA + /api and /uploads to Kestrel (127.0.0.1:5135).
#
# Install (Alpine):
#   apk add nginx
#   cp deploy/nginx/iqadms-pqad.conf /etc/nginx/http.d/iqadms.conf
#   # Edit root= below if your clone is not under /root/IQADMS
#   nginx -t && rc-service nginx start
#
# Before nginx binds to 5173, stop the Node static server:
#   pkill -f "serve dist"   # or stop your tmux iqadms-web session
#
# Rebuild frontend on pqad after pull:
#   cd frontend/iqadms-frontend && npm run build
#
# Ensure nginx can read dist (if under /root):
#   chmod -R a+rX /root/IQADMS/frontend/iqadms-frontend/dist
#
# Test locally:
#   curl -sI http://127.0.0.1:5173/
#   curl -s "http://127.0.0.1:5173/api/Auth/check-email?email=a@b.com" | head -c 80

server {
    listen 0.0.0.0:5173;
    server_name _;

    root /root/IQADMS/frontend/iqadms-frontend/dist;
    index index.html;

    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:5135;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5135;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
